# Broker Mosquitto para la estacion de riego (red local)
# Ejecutar desde esta carpeta:  mosquitto -c mosquitto.conf -v
per_listener_settings true

# App Android: cifrado TLS (ISO 27002 8.24). Solo usuarios de personas (admin, observador).
listener 8883
allow_anonymous false
password_file passwd
acl_file acl
cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key

# Arduino: sin TLS dentro de la red local (el R4 no tiene la CA cargada). Solo el usuario "estacion".
listener 1883
allow_anonymous false
password_file passwd_estacion
acl_file acl
